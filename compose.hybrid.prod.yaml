# Add after compose.prod.yaml (and compose.coexist.yaml when applicable).
# Uses the same Java runtime settings as local Docker, but never builds on the server.
services:
  platform-service:
    extends:
      file: compose.platform.yaml
      service: platform-service
    build: !reset null
    image: "${JOB_AGENT_PLATFORM_IMAGE:?set JOB_AGENT_PLATFORM_IMAGE}"
    ports: !reset []
    expose: ["8081"]
    environment:
      JOB_AGENT_ENVIRONMENT: production
      JOB_AGENT_DEMO_RECHARGE_ENABLED: "${JOB_AGENT_DEMO_RECHARGE_ENABLED:-false}"
      PLATFORM_AUTH_ENABLED: "true"
      PLATFORM_WEB_SECURITY_ENABLED: "true"
      JOB_AGENT_ACCOUNT_ACTION_SECRET: "${JOB_AGENT_ACCOUNT_ACTION_SECRET:?set JOB_AGENT_ACCOUNT_ACTION_SECRET}"
      JOB_AGENT_PUBLIC_BASE_URL: "${JOB_AGENT_PUBLIC_BASE_URL:?set JOB_AGENT_PUBLIC_BASE_URL}"
      JOB_AGENT_REGISTRATION_ENABLED: "${JOB_AGENT_REGISTRATION_ENABLED:-true}"
      JOB_AGENT_CONSENT_REQUIRED: "${JOB_AGENT_CONSENT_REQUIRED:-true}"
      JOB_AGENT_TERMS_VERSION: "${JOB_AGENT_TERMS_VERSION:?set JOB_AGENT_TERMS_VERSION}"
      JOB_AGENT_PRIVACY_VERSION: "${JOB_AGENT_PRIVACY_VERSION:?set JOB_AGENT_PRIVACY_VERSION}"
      JOB_AGENT_EMAIL_VERIFICATION_REQUIRED: "${JOB_AGENT_EMAIL_VERIFICATION_REQUIRED:-true}"
      JOB_AGENT_COOKIE_SECURE: "${JOB_AGENT_COOKIE_SECURE:-true}"
      JOB_AGENT_CSRF_ENABLED: "${JOB_AGENT_CSRF_ENABLED:-true}"
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
  web:
    environment: &platform-client
      JOB_AGENT_JAVA_AUTH_ENABLED: "true"
      JOB_AGENT_JAVA_AUTH_BASE_URL: "http://platform-service:8081"
      JOB_AGENT_JAVA_AUTH_INTERNAL_TOKEN: "${JOB_AGENT_PLATFORM_INTERNAL_TOKEN:?set JOB_AGENT_PLATFORM_INTERNAL_TOKEN}"
      JOB_AGENT_JAVA_BILLING_ENABLED: "${JOB_AGENT_JAVA_BILLING_ENABLED:-false}"
      JOB_AGENT_JAVA_BILLING_BASE_URL: "http://platform-service:8081"
      JOB_AGENT_JAVA_BILLING_INTERNAL_TOKEN: "${JOB_AGENT_PLATFORM_INTERNAL_TOKEN:?set JOB_AGENT_PLATFORM_INTERNAL_TOKEN}"
    depends_on:
      platform-service:
        condition: service_healthy
  worker:
    environment: *platform-client
    depends_on:
      platform-service:
        condition: service_healthy
  beat:
    environment: *platform-client
    depends_on:
      platform-service:
        condition: service_healthy

  reverse-proxy:
    volumes: !override
      - ./deploy/Caddyfile.hybrid:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      platform-service:
        condition: service_healthy
  prometheus:
    extends:
      file: compose.platform.yaml
      service: prometheus

secrets:
  platform_metrics_token:
    environment: JOB_AGENT_PLATFORM_METRICS_TOKEN
