name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: job_agent
          POSTGRES_USER: job_agent
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_agent -d job_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      JOB_AGENT_TEST_DATABASE_URL: postgresql+psycopg://job_agent@127.0.0.1:5432/job_agent
      PIP_AUDIT_VERSION: "2.10.1"
      TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install locked dependencies and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock -r requirements-dev.lock

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run lint
        run: ruff check src tests alembic

      - name: Compile Python sources
        run: python -m compileall -q src tests alembic

      - name: Run frontend regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/frontend_*.mjs; do
            node "$test_file"
          done

      - name: Audit locked Python dependencies
        id: python_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-reports
          python -m pip install --disable-pip-version-check "pip-audit==$PIP_AUDIT_VERSION"
          python -m pip_audit \
            -r requirements.lock \
            -r requirements-dev.lock \
            --format json \
            --output security-reports/python-dependencies.json

      - name: Validate development Compose configuration
        env:
          JOB_AGENT_REDIS_PASSWORD: ci-redis-password
        run: docker compose --env-file .env.example -f compose.yaml config --quiet

      - name: Validate Prometheus configuration and alert rules
        run: >-
          docker run --rm --entrypoint /bin/promtool
          -v "$PWD/deploy/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.13.1
          check config /etc/prometheus/prometheus.yml

      - name: Build release image
        run: docker build --pull --no-cache --tag job-hunting-agent:ci .

      - name: Record container findings and CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-cache" security-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            -v "$PWD/security-reports:/reports" \
            "$TRIVY_IMAGE" image \
            --quiet \
            --scanners vuln \
            --pkg-types os \
            --severity HIGH,CRITICAL \
            --format json \
            --output /reports/container-vulnerabilities.json \
            job-hunting-agent:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            -v "$PWD/security-reports:/reports" \
            "$TRIVY_IMAGE" image \
            --quiet \
            --format cyclonedx \
            --output /reports/image-sbom.cdx.json \
            job-hunting-agent:ci

      - name: Enforce fixable high and critical container gate
        id: container_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            "$TRIVY_IMAGE" image \
            --quiet \
            --scanners vuln \
            --pkg-types os \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            job-hunting-agent:ci

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports
          path: security-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce security scan results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.python_audit.outcome }}" != "success" ]]; then
            echo "Python dependency audit failed. Review the security-reports artifact."
            exit 1
          fi
          if [[ "${{ steps.container_audit.outcome }}" != "success" ]]; then
            echo "Container vulnerability gate failed. Review the security-reports artifact."
            exit 1
          fi
