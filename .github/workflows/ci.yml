name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: job_agent
          POSTGRES_USER: job_agent
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_agent -d job_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      JOB_AGENT_TEST_DATABASE_URL: postgresql+psycopg://job_agent@127.0.0.1:5432/job_agent

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install locked dependencies and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock -r requirements-dev.lock

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run lint
        run: ruff check src tests alembic

      - name: Compile Python sources
        run: python -m compileall -q src tests alembic

      - name: Run frontend regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/frontend_*.mjs; do
            node "$test_file"
          done

      - name: Validate development Compose configuration
        env:
          JOB_AGENT_REDIS_PASSWORD: ci-redis-password
        run: docker compose --env-file .env.example -f compose.yaml config --quiet

      - name: Build release image
        run: docker build --tag job-hunting-agent:ci .
