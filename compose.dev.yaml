# 本文件只用于本机开发：通过 `-f compose.yaml -f compose.dev.yaml` 叠加使用。
# 默认 compose.yaml 保持可复现的镜像运行方式，避免把开发期的源码挂载带到部署环境。
services:
  migrate:
    volumes:
      # 开发模式下迁移脚本也随宿主机代码更新，避免新增 revision 后必须先重建镜像。
      - ./src:/app/src:ro
      - ./alembic:/app/alembic:ro
  web:
    # 覆盖默认启动命令，使 Uvicorn 在 Python 源码变化时重新导入应用工厂。
    command:
      - job-agent-web
      - --env-file
      - /app/.env
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    volumes:
      # 只读源码挂载让容器立即看到宿主机修改；依赖和镜像仍保持由 Dockerfile 管理。
      - ./src:/app/src:ro
      - ./alembic:/app/alembic:ro
  worker:
    volumes:
      # Worker 执行任务时也会校验数据库 revision，必须和 Web 使用同一份源码与迁移目录。
      - ./src:/app/src:ro
      - ./alembic:/app/alembic:ro
  beat:
    volumes:
      # Beat 复用 Worker 应用配置；开发模式下保持同一迁移视图。
      - ./src:/app/src:ro
      - ./alembic:/app/alembic:ro
