openapi: 3.1.0
info:
  title: Job Screenshot Upload Entry
  version: 1.0.0
  description: Java owns the public multipart boundary; Python owns image validation, ClamAV, multimodal extraction, job persistence and deduplication.
paths:
  /api/jobs/screenshots:
    post:
      description: Requires Session and CSRF. Java accepts 1-4 images, 8 MiB per image and 20 MiB total, then forwards the multipart body once to Python. Python revalidates the real Session and runs the existing PNG/JPEG/WebP validation, ClamAV scan, multimodal extraction and job import flow. The callback is never replayed after an uncertain connection.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [screenshots]
              properties:
                screenshots: {type: array, minItems: 1, maxItems: 4, items: {type: string, format: binary}}
                source_url: {type: [string, 'null'], maxLength: 2048}
      responses:
        '200': {description: Imported job and screenshot extraction summary.}
        '400': {description: JOB_SCREENSHOT_INVALID}
        '401': {description: SESSION_EXPIRED}
        '403': {description: CSRF_REJECTED}
        '409': {description: DUPLICATE_RESOURCE or JOB_BUSY}
        '413': {description: JOB_SCREENSHOT_TOO_LARGE}
        '422': {description: FILE_INFECTED}
        '429': {description: RATE_LIMITED}
        '502': {description: JOB_SCREENSHOT_MODEL_ERROR}
        '503': {description: FILE_SCANNER_UNAVAILABLE or JOB_SCREENSHOT_UNAVAILABLE}
  /internal/v1/jobs/screenshots:
    post:
      description: Private Java-to-Python callback. Requires X-Internal-Service-Token and the real session_token. It is not exposed by Caddy or Nginx.
