openapi: 3.1.0
info:
  title: Job Hunting Authentication Internal Contract
  version: 0.1.0
  description: >-
    Internal contract used by the Python Web service during the gradual
    migration of account registration, sessions and administrator account
    operations to Java.
    Passwords are accepted only in memory and are never returned or logged.
servers:
  - url: http://platform-service:8081
security:
  - InternalToken: []
paths:
  /internal/v1/auth/sessions/login:
    $ref: './sessions.openapi.yaml#/paths/~1internal~1v1~1auth~1sessions~1login'
  /internal/v1/auth/sessions/resolve:
    $ref: './sessions.openapi.yaml#/paths/~1internal~1v1~1auth~1sessions~1resolve'
  /internal/v1/auth/sessions/logout:
    $ref: './sessions.openapi.yaml#/paths/~1internal~1v1~1auth~1sessions~1logout'
  /internal/v1/auth/sessions/logout-all:
    $ref: './sessions.openapi.yaml#/paths/~1internal~1v1~1auth~1sessions~1logout-all'
  /internal/v1/auth/sessions/change-password:
    $ref: './sessions.openapi.yaml#/paths/~1internal~1v1~1auth~1sessions~1change-password'
  /internal/v1/auth/password-reset/request:
    $ref: './password-reset.openapi.yaml#/paths/~1internal~1v1~1auth~1password-reset~1request'
  /internal/v1/auth/password-reset/confirm:
    $ref: './password-reset.openapi.yaml#/paths/~1internal~1v1~1auth~1password-reset~1confirm'
  /internal/v1/auth/password-reset/due:
    $ref: './password-reset.openapi.yaml#/paths/~1internal~1v1~1auth~1password-reset~1due'
  /internal/v1/auth/password-reset/claim:
    $ref: './password-reset.openapi.yaml#/paths/~1internal~1v1~1auth~1password-reset~1claim'
  /internal/v1/auth/password-reset/finish:
    $ref: './password-reset.openapi.yaml#/paths/~1internal~1v1~1auth~1password-reset~1finish'
  /internal/v1/auth/password-reset/observations:
    $ref: './password-reset.openapi.yaml#/paths/~1internal~1v1~1auth~1password-reset~1observations'
  /internal/v1/auth/email-verification/request:
    $ref: './email-verification.openapi.yaml#/paths/~1internal~1v1~1auth~1email-verification~1request'
  /internal/v1/auth/email-verification/confirm:
    $ref: './email-verification.openapi.yaml#/paths/~1internal~1v1~1auth~1email-verification~1confirm'
  /internal/v1/auth/email-verification/due:
    $ref: './email-verification.openapi.yaml#/paths/~1internal~1v1~1auth~1email-verification~1due'
  /internal/v1/auth/email-verification/claim:
    $ref: './email-verification.openapi.yaml#/paths/~1internal~1v1~1auth~1email-verification~1claim'
  /internal/v1/auth/email-verification/finish:
    $ref: './email-verification.openapi.yaml#/paths/~1internal~1v1~1auth~1email-verification~1finish'
  /internal/v1/auth/email-verification/observations:
    $ref: './email-verification.openapi.yaml#/paths/~1internal~1v1~1auth~1email-verification~1observations'
  /internal/v1/auth/register:
    post:
      operationId: registerAccount
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          description: Account and its zero-balance summary were created atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResult'
        '409':
          $ref: '#/components/responses/AccountAlreadyExists'
        '401':
          $ref: '#/components/responses/InternalUnauthorized'
  /internal/v1/auth/accounts/list:
    post:
      operationId: listAccounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: Safe account projections for an authenticated administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
  /internal/v1/auth/accounts/me:
    post:
      operationId: getCurrentAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: Safe projection for the account bound to the session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/InternalUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /internal/v1/auth/accounts/profile:
    post:
      operationId: updateCurrentAccountProfile
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: Updated safe projection for the account bound to the session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/InternalUnauthorized'
        '404':
          $ref: '#/components/responses/AccountNotFound'
  /internal/v1/auth/accounts/status:
    post:
      operationId: updateAccountStatus
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountStatusRequest'
      responses:
        '200':
          description: Account status and audit event were updated atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InternalUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
  /internal/v1/auth/accounts/bootstrap:
    post:
      operationId: bootstrapInitialAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '200':
          description: Bootstrap is idempotent once any undeleted administrator exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResult'
        '409':
          $ref: '#/components/responses/AccountAlreadyExists'
components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Service-Token
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    RegistrationRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 1024
        display_name:
          type: string
          maxLength: 128
        email_verified:
          type: boolean
          default: false
        consents:
          type: array
          items:
            $ref: '#/components/schemas/Consent'
    Consent:
      type: object
      required: [document_type, version]
      properties:
        document_type:
          type: string
          enum: [terms, privacy]
        version:
          type: string
          maxLength: 64
        ip_address:
          type: string
          maxLength: 64
        user_agent:
          type: string
          maxLength: 512
    AccountResult:
      type: object
      required: [account_id]
      properties:
        account_id:
          type: integer
          format: int64
          minimum: 1
    SessionRequest:
      type: object
      required: [session_token]
      properties:
        session_token:
          type: string
          minLength: 1
          maxLength: 128
    AccountStatusRequest:
      type: object
      required: [session_token, account_id, status]
      properties:
        session_token:
          type: string
          minLength: 1
          maxLength: 128
        account_id:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum: [active, disabled]
    ProfileRequest:
      type: object
      required: [session_token]
      properties:
        session_token:
          type: string
          minLength: 1
          maxLength: 128
        display_name:
          type: string
          nullable: true
          maxLength: 128
    BootstrapRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 1024
        display_name:
          type: string
          maxLength: 128
    AccountProjection:
      type: object
      required: [account_id, email, role, status, must_change_password, created_at, updated_at]
      properties:
        account_id: {type: integer, format: int64, minimum: 1}
        email: {type: string, format: email}
        display_name: {type: string, nullable: true}
        role: {type: string, enum: [user, admin]}
        status: {type: string, enum: [active, disabled]}
        must_change_password: {type: boolean}
        email_verified_at: {type: string, nullable: true}
        deleted_at: {type: string, nullable: true}
        created_at: {type: string}
        updated_at: {type: string}
    AccountList:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items: {$ref: '#/components/schemas/AccountProjection'}
    AccountResponse:
      type: object
      required: [account]
      properties:
        account:
          $ref: '#/components/schemas/AccountProjection'
    BootstrapResult:
      type: object
      required: [created]
      properties:
        created: {type: boolean}
        account_id: {type: integer, format: int64, minimum: 1, nullable: true}
    Error:
      type: object
      required: [code, message, trace_id]
      properties:
        code: {type: string}
        message: {type: string}
        trace_id: {type: string}
  responses:
    AccountAlreadyExists:
      description: Email is already registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalUnauthorized:
      description: Internal service token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRequest:
      description: Request validation or account policy rejected the operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The session is not an administrator or the target operation is forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccountNotFound:
      description: Account does not exist or has been deleted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
