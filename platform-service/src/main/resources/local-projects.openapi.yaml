openapi: 3.1.0
info:
  title: Local Project Collection Management
  version: 1.1.0
  description: Java public entry; Python owns manifest planning, file scanning/parsing, collection facts, atomic completion and cancellable cleanup. Java relays one bounded multipart batch without automatic replay. No new page or upload mode.
paths:
  /api/projects/local/manifest:
    post:
      description: Session and CSRF required. Maximum 20000 files, 4 MiB normalized request; no file bytes. Existing candidate+canonical manifest fingerprint resumes the same incomplete collection, resetting failed files but retaining analyzed evidence. Ready collections return 409. Exclusive account-work admission prevents concurrent uploads/resume/cancel; busy returns 409. Known credential paths are skipped by Python policy. 200 is a collection plan, not completed analysis. Same metadata may be retried explicitly after timeout; no transport replay or local fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate_id, project_name, files]
              properties:
                candidate_id: {type: integer, minimum: 1, maximum: 9223372036854775807}
                project_name: {type: string, minLength: 1, maxLength: 256}
                files: {type: array, minItems: 1, maxItems: 20000, items: {$ref: '#/components/schemas/ManifestFile'}}
      responses:
        '200':
          description: No-store, up to 16 MiB; public fields only. Two concurrent local callbacks per process, shared with collection reads/cancellations; Java callback deadline 10 seconds. Files marked selected are uploaded through the existing Python batch endpoint.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [collection, files, selected_files, resumed]
                properties:
                  collection: {$ref: '#/components/schemas/Collection'}
                  files: {type: array, minItems: 1, maxItems: 20000, items: {$ref: '#/components/schemas/File'}}
                  selected_files: {type: array, items: {$ref: '#/components/schemas/File'}, description: Exact selected subset of files.}
                  resumed: {type: boolean}
        '400': {description: PROJECT_MANIFEST_INVALID; no raw paths or file contents in errors.}
        '409': {description: PROJECT_BUSY or PROJECT_COLLECTION_CONFLICT}
        '413': {description: PROJECT_TOO_LARGE}
        '422': {description: INVALID_REQUEST}
        '503': {description: PROJECT_UNAVAILABLE; retain local recovery handle, do not claim success.}
  /api/projects/local/{collection_id}:
    parameters:
      - {in: path, name: collection_id, required: true, schema: {type: integer, minimum: 1, maximum: 9223372036854775807}}
    get:
      description: Session required. Python reads owned session and files in one repeatable-read snapshot. Java validates scope, counts and field whitelist; no-store, maximum 16 MiB. No original extraction metadata, internal account ID, storage keys or raw errors.
      responses:
        '200':
          description: Authoritative resumable progress, not a cached empty fallback.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [collection, files]
                properties:
                  collection: {$ref: '#/components/schemas/Collection'}
                  files: {type: array, minItems: 1, maxItems: 20000, items: {$ref: '#/components/schemas/File'}}
        '404': {description: PROJECT_NOT_FOUND, including foreign collection.}
        '503': {description: PROJECT_UNAVAILABLE; preserve browser recovery handle.}
    delete:
      description: Session and CSRF required. Cannot cancel a ready collection; use project deletion. Exclusive account work plus account row lock excludes admitted HTTP uploads and Worker claims; running tasks return 409. Python cancels queued collection tasks and atomically deletes SQL evidence/vectors with a durable all-version object manifest. Maintenance leases/retries physical cleanup. Repeated cancellation reads the owned receipt, never recreates a collection. New imports have new IDs, so late uploads cannot write to cancelled sessions.
      responses:
        '200':
          description: Database deletion committed; pending means physical attachment cleanup continues. Never expose object keys.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cancellation'}
        '404': {description: PROJECT_NOT_FOUND}
        '409': {description: PROJECT_BUSY or PROJECT_COLLECTION_CONFLICT}
        '503': {description: PROJECT_UNAVAILABLE; retry same collection ID after checking progress.}
  /api/projects/local/{collection_id}/complete:
    parameters:
      - {in: path, name: collection_id, required: true, schema: {type: integer, minimum: 1, maximum: 9223372036854775807}}
    post:
      description: Session and CSRF required, no body (empty JSON object also accepted). Java revalidates the session; Python admits exclusive account work and locks the active account. Pending selected files or no usable analyzed text return 409 before any card write. Failed files may be deferred with a fixed public reason. Card deduplication and collection ready/link commit in the same transaction. Repeated completion returns the linked card, even after confirmation; no new facts, model call or RAG task. Files remain on the Python multipart route. No callback replay or fallback on timeout; query progress and explicitly retry the same collection ID. Internal account_id and completion_collection_id are validated and stripped by Java.
      responses:
        '200':
          description: No-store, maximum 4 MiB; completion is not confirmation of profile facts or completion of earlier RAG tasks. 10-second callback deadline; shares two local callback slots per process.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project_card, processing_async]
                properties:
                  project_card: {$ref: './projects.openapi.yaml#/components/schemas/Record'}
                  processing_async: {const: false}
        '401': {description: SESSION_EXPIRED}
        '403': {description: CSRF_REJECTED or PROJECT_SCOPE_DENIED}
        '404': {description: PROJECT_NOT_FOUND, including foreign or deleted collection.}
        '409': {description: PROJECT_BUSY, PROJECT_COLLECTION_INCOMPLETE or PROJECT_COLLECTION_CONFLICT; no partial card committed.}
        '422': {description: INVALID_REQUEST}
        '429': {description: RATE_LIMITED}
        '503': {description: PROJECT_UNAVAILABLE; preserve browser recovery ID. No fake completion.}
  /api/projects/local/{collection_id}/files:
    parameters:
      - {in: path, name: collection_id, required: true, schema: {type: integer, minimum: 1, maximum: 9223372036854775807}}
    post:
      description: Session and CSRF required. Java validates 1-5 unique positive file IDs, multipart cardinality, 50 MiB per part and 160 MiB per batch, then forwards the body once to Python. The body is never replayed after an uncertain connection. Python rechecks ownership, planned file IDs, exact byte length and SHA-256 before ClamAV, extraction, visual artifact persistence and incremental RAG/visual indexing. Parser and infected-file failures become per-file failed entries; scanner outage is 503. No object keys, extracted metadata or raw parser errors are returned.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file_ids, files]
              properties:
                file_ids: {type: string, description: JSON array of unique file IDs in the same order as files.}
                files: {type: array, minItems: 1, maxItems: 5, items: {type: string, format: binary}}
      responses:
        '200':
          description: No-store, safe processed/failed file summaries and bounded background task receipts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadResult'}
        '400': {description: PROJECT_UPLOAD_INVALID}
        '401': {description: SESSION_EXPIRED}
        '403': {description: CSRF_REJECTED or PROJECT_SCOPE_DENIED}
        '404': {description: PROJECT_NOT_FOUND}
        '409': {description: PROJECT_BUSY}
        '413': {description: PROJECT_UPLOAD_TOO_LARGE}
        '422': {description: INVALID_REQUEST}
        '503': {description: PROJECT_UNAVAILABLE; retry the same batch only after checking collection progress.}
components:
  schemas:
    ManifestFile:
      type: object
      additionalProperties: false
      required: [relative_path, file_size]
      properties:
        relative_path: {type: string, minLength: 1, maxLength: 2048}
        file_size: {type: integer, minimum: 0, maximum: 281474976710656}
        sha256: {type: [string, 'null'], pattern: '^[a-fA-F0-9]{64}$'}
        media_type: {type: string, maxLength: 128, default: application/octet-stream}
        last_modified: {type: [integer, 'null'], minimum: 0, maximum: 9007199254740991}
    UploadFile:
      type: object
      additionalProperties: false
      required: [id, collection_id, relative_path, file_size, selection_status, selection_reason, extraction_method, text_length, created_at, updated_at]
      properties:
        id: {type: integer, minimum: 1}
        collection_id: {type: integer, minimum: 1}
        relative_path: {type: string, minLength: 1, maxLength: 2048}
        file_size: {type: integer, minimum: 0}
        selection_status: {type: string, enum: [analyzed]}
        selection_reason: {type: string, maxLength: 256}
        extraction_method: {type: [string, 'null'], maxLength: 128}
        text_length: {type: integer, minimum: 0}
        created_at: {type: string}
        updated_at: {type: string}
    UploadFailure:
      type: object
      additionalProperties: false
      required: [id, selection_reason]
      properties:
        id: {type: [integer, string]}
        selection_reason: {type: string, const: file_processing_failed}
    UploadResult:
      type: object
      additionalProperties: false
      required: [processed_files, failed_files, rag_task, visual_task, visual_index, visual_warning]
      properties:
        processed_files: {type: array, items: {$ref: '#/components/schemas/UploadFile'}}
        failed_files: {type: array, items: {$ref: '#/components/schemas/UploadFailure'}}
        rag_task: {oneOf: [{$ref: '#/components/schemas/UploadTask'}, {type: 'null'}]}
        visual_task: {oneOf: [{$ref: '#/components/schemas/UploadTask'}, {type: 'null'}]}
        visual_index: {oneOf: [{type: object, additionalProperties: false, required: [indexed], properties: {indexed: {const: true}}}, {type: 'null'}]}
        visual_warning: {type: [string, 'null'], maxLength: 512}
    UploadTask:
      type: object
      additionalProperties: false
      required: [task_key, task_type, status, progress, attempt, max_attempts, result, error_summary, created_at, started_at, finished_at, updated_at]
      properties:
        task_key: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
        task_type: {enum: [rag_index, visual_index]}
        status: {enum: [queued, running, succeeded, failed, cancelled]}
        progress: {type: integer, minimum: 0, maximum: 100}
        attempt: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1}
        result: {oneOf: [{type: 'null'}, {type: object, additionalProperties: false, maxProperties: 0}]}
        error_summary: {type: [string, 'null']}
        created_at: {type: string}
        started_at: {type: [string, 'null']}
        finished_at: {type: [string, 'null']}
        updated_at: {type: string}
    Collection:
      type: object
      additionalProperties: false
      required: [id, candidate_id, project_card_id, project_name, source_type, manifest_fingerprint, status, file_count, selected_file_count, uploaded_file_count, total_size, selected_size, error_summary, created_at, updated_at]
      properties:
        id: {type: integer, minimum: 1}
        candidate_id: {type: integer, minimum: 1}
        project_card_id: {type: [integer, 'null'], minimum: 1}
        project_name: {type: string}
        source_type: {const: local_directory_collection}
        manifest_fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        status: {enum: [planned, uploading, processing, ready, failed, cancelled]}
        file_count: {type: integer, minimum: 1, maximum: 20000}
        selected_file_count: {type: integer, minimum: 0}
        uploaded_file_count: {type: integer, minimum: 0}
        total_size: {type: integer, minimum: 0}
        selected_size: {type: integer, minimum: 0}
        error_summary: {type: [string, 'null'], description: Fixed safe summary, never provider or SQL errors.}
        created_at: {type: string}
        updated_at: {type: string}
    File:
      type: object
      additionalProperties: false
      required: [id, collection_id, relative_path, file_kind, media_type, file_size, client_sha256, server_sha256, selection_status, selection_reason, extraction_method, text_length, long_text_id, metadata, created_at, updated_at]
      properties:
        id: {type: integer, minimum: 1}
        collection_id: {type: integer, minimum: 1}
        relative_path: {type: string, minLength: 1, maxLength: 2048}
        file_kind: {type: string}
        media_type: {type: string}
        file_size: {type: integer, minimum: 0}
        client_sha256: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
        server_sha256: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
        selection_status: {enum: [selected, skipped, uploaded, analyzed, failed]}
        selection_reason: {type: string, description: Fixed safe reason on failed files.}
        extraction_method: {type: [string, 'null']}
        text_length: {type: integer, minimum: 0}
        long_text_id: {type: [integer, 'null'], minimum: 1}
        metadata:
          type: object
          additionalProperties: false
          required: [last_modified]
          properties:
            last_modified: {type: [integer, 'null'], minimum: 0}
        created_at: {type: string}
        updated_at: {type: string}
    Cancellation:
      type: object
      additionalProperties: false
      required: [deleted, collection_id, candidate_id, cleanup_status, rag_cleanup]
      properties:
        deleted: {const: true}
        collection_id: {type: integer, minimum: 1}
        candidate_id: {type: integer, minimum: 1}
        cleanup_status: {enum: [pending, completed]}
        rag_cleanup: {const: database_cascade}
