openapi: 3.1.0
info:
  title: Administrator Usage Read Contract
  version: 1.0.0
  description: >-
    Active real administrator sessions required. Python owns event writes and physical
    retention; Java reads a per-account 500-row window before applying filters.
    Each response uses a read-only Repeatable Read snapshot. No summary cache, local
    fallback or financial ledger pruning. Public responses have Cache-Control no-store.
security: [{SessionCookie: []}]
paths:
  /api/admin/usage/summary:
    get:
      operationId: adminUsageSummary
      responses:
        '200':
          description: Usage, tool counts and non-deleted account balance projections
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageSummary'}
        default: {$ref: '#/components/responses/Error'}
  /api/admin/usage/events:
    get:
      operationId: adminUsageEvents
      parameters:
        - {name: account_id, in: query, schema: {type: integer, format: int64}}
        - {name: candidate_id, in: query, schema: {type: integer, format: int64}}
        - {name: session_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
        - {name: offset, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}}
      responses:
        '200':
          description: Descending created_at then ID; total is counted after retention and filters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsagePage'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/admin/usage/summary:
    post:
      operationId: internalAdminUsageSummary
      security: [{InternalServiceToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionRequest'}
      responses:
        '200':
          description: Same public projection, real administrator session required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageSummary'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/admin/usage/events:
    post:
      operationId: internalAdminUsageEvents
      security: [{InternalServiceToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/SessionRequest'}
                - type: object
                  required: [limit, offset]
                  properties:
                    account_id: {type: [integer, 'null'], format: int64}
                    candidate_id: {type: [integer, 'null'], format: int64}
                    session_id: {type: [string, 'null']}
                    limit: {type: integer, minimum: 1, maximum: 100}
                    offset: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Same public page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsagePage'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    SessionCookie: {$ref: 'billing-personal.openapi.yaml#/components/securitySchemes/SessionCookie'}
    InternalServiceToken: {$ref: 'billing-personal.openapi.yaml#/components/securitySchemes/InternalServiceToken'}
  schemas:
    SessionRequest:
      type: object
      required: [session_token]
      properties:
        session_token: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
    UsageSummary:
      type: object
      required: [summary, by_account, tool_calls_by_account, billing, page_size, max_pages]
      properties:
        summary: {$ref: '#/components/schemas/Totals'}
        by_account:
          type: array
          items:
            allOf:
              - {$ref: '#/components/schemas/Totals'}
              - type: object
                required: [account_id]
                properties:
                  account_id: {type: integer, format: int64}
        tool_calls_by_account:
          type: array
          items:
            type: object
            required: [account_id, trace_count, failed_trace_count]
            properties:
              account_id: {type: integer, format: int64}
              trace_count: {type: integer, minimum: 0}
              failed_trace_count: {type: integer, minimum: 0}
        billing:
          type: object
          required: [settings, summary, by_account]
          properties:
            settings: {type: object, description: Existing masked BillingReadSettings projection}
            summary: {type: object, description: Existing balance totals and healthy/low/suspended account counts}
            by_account: {type: array, items: {type: object}, description: Existing safe balance projection with email/role/status and account-specific threshold}
        page_size: {const: 100}
        max_pages: {const: 5}
    Totals:
      type: object
      required: [input_tokens, output_tokens, total_tokens, billable_tokens, event_count]
      properties:
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
        billable_tokens: {type: integer, minimum: 0}
        event_count: {type: integer, minimum: 0}
    UsagePage:
      type: object
      required: [events, total, limit, offset, page_size, max_pages]
      properties:
        events: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/UsageEvent'}}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, format: int64}
        page_size: {const: 100}
        max_pages: {const: 5}
    UsageEvent:
      type: object
      additionalProperties: false
      required: [id, account_id, candidate_id, session_id, root_request_id, call_id, provider, model,
                 operation, input_tokens, output_tokens, total_tokens, usage_source, status, attempt,
                 provider_request_id, raw_usage, created_at, billable, pricing_version]
      properties:
        id: {type: integer, format: int64}
        account_id: {type: integer, format: int64}
        candidate_id: {type: [integer, 'null'], format: int64}
        session_id: {type: [string, 'null']}
        root_request_id: {type: [string, 'null']}
        call_id: {type: string}
        provider: {type: string}
        model: {type: string}
        operation: {type: string}
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
        usage_source: {type: string}
        status: {type: string}
        attempt: {type: integer, minimum: 1}
        provider_request_id: {type: [string, 'null']}
        raw_usage: {type: object}
        created_at: {type: string, format: date-time}
        billable: {type: boolean}
        pricing_version: {type: [string, 'null']}
  responses:
    Error:
      description: 401 invalid session/token; 403 non-admin; 422 invalid filters/page; 429 rate limit; 503 unavailable
      content:
        application/json:
          schema: {$ref: 'billing-personal.openapi.yaml#/components/schemas/Error'}
