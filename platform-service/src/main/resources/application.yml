spring:
  application:
    name: job-hunting-platform
  autoconfigure:
    # 平台服务骨架默认不连接数据库；启用 PLATFORM_BILLING_ENABLED 后，
    # BillingConfiguration 会创建 PostgreSQL DataSource。
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    protocol: ${SERVER_TOMCAT_PROTOCOL:org.apache.coyote.http11.Http11NioProtocol}

app:
  version: ${APP_VERSION:0.1.0}

platform:
  internal-token: ${PLATFORM_INTERNAL_TOKEN:}
  auth:
    enabled: ${PLATFORM_AUTH_ENABLED:false}
  billing:
    enabled: ${PLATFORM_BILLING_ENABLED:false}
    price-per-million-tokens-yuan: ${PLATFORM_PRICE_PER_MILLION_TOKENS_YUAN:25.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false
