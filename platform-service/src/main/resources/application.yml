spring:
  application:
    name: job-hunting-platform
  autoconfigure:
    # 平台服务骨架默认不连接数据库；启用 PLATFORM_BILLING_ENABLED 后，
    # BillingConfiguration 会创建 PostgreSQL DataSource。
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      client-type: jedis
      host: ${PLATFORM_REDIS_HOST:localhost}
      port: ${PLATFORM_REDIS_PORT:6379}
      password: ${PLATFORM_REDIS_PASSWORD:}
      database: ${PLATFORM_REDIS_DATABASE:1}
      connect-timeout: 1s
      timeout: 1s
      jedis:
        pool:
          max-active: 16
          max-idle: 8
          max-wait: 1s
      repositories:
        enabled: false

server:
  forward-headers-strategy: none
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    protocol: ${SERVER_TOMCAT_PROTOCOL:org.apache.coyote.http11.Http11NioProtocol}

app:
  version: ${APP_VERSION:0.1.0}

platform:
  ingress:
    trusted-proxy-cidrs: ${PLATFORM_TRUSTED_PROXY_CIDRS:}
  metrics:
    enabled: ${PLATFORM_METRICS_ENABLED:false}
    token: ${PLATFORM_METRICS_TOKEN:}
    token-file: ${PLATFORM_METRICS_TOKEN_FILE:}
  internal-token: ${PLATFORM_INTERNAL_TOKEN:}
  account-export:
    python-base-url: ${PLATFORM_ACCOUNT_EXPORT_PYTHON_BASE_URL:http://web:8000}
    connect-timeout-ms: ${PLATFORM_ACCOUNT_EXPORT_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${PLATFORM_ACCOUNT_EXPORT_READ_TIMEOUT_MS:30000}
  profiles:
    python-base-url: ${PLATFORM_PROFILES_PYTHON_BASE_URL:http://web:8000}
    connect-timeout-ms: ${PLATFORM_PROFILES_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${PLATFORM_PROFILES_READ_TIMEOUT_MS:10000}
  chat:
    python-base-url: ${PLATFORM_CHAT_PYTHON_BASE_URL:http://web:8000}
  observability:
    python-base-url: ${PLATFORM_OBSERVABILITY_PYTHON_BASE_URL:http://web:8000}
    connect-timeout-ms: ${PLATFORM_OBSERVABILITY_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${PLATFORM_OBSERVABILITY_READ_TIMEOUT_MS:2000}
  auth:
    enabled: ${PLATFORM_AUTH_ENABLED:false}
  tasks:
    python-base-url: ${PLATFORM_TASKS_PYTHON_BASE_URL:http://web:8000}
    connect-timeout-ms: ${PLATFORM_TASKS_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${PLATFORM_TASKS_READ_TIMEOUT_MS:5000}
  web-security:
    enabled: ${PLATFORM_WEB_SECURITY_ENABLED:false}
    environment: ${JOB_AGENT_ENVIRONMENT:development}
    csrf-enabled: ${JOB_AGENT_CSRF_ENABLED:true}
    cookie-secure: ${JOB_AGENT_COOKIE_SECURE:false}
    public-base-url: ${JOB_AGENT_PUBLIC_BASE_URL:http://localhost:8000}
    key-prefix: ${PLATFORM_RATE_LIMIT_KEY_PREFIX:job_agent:platform_rate_limit}
    window-seconds: ${JOB_AGENT_RATE_LIMIT_WINDOW_SECONDS:60}
    auth-requests: ${JOB_AGENT_RATE_LIMIT_AUTH_REQUESTS:20}
    admin-requests: ${JOB_AGENT_RATE_LIMIT_ADMIN_REQUESTS:120}
    write-requests: ${JOB_AGENT_RATE_LIMIT_WRITE_REQUESTS:120}
    model-requests: ${JOB_AGENT_RATE_LIMIT_MODEL_REQUESTS:60}
    default-requests: ${JOB_AGENT_RATE_LIMIT_DEFAULT_REQUESTS:240}
  email:
    action-secret: ${JOB_AGENT_ACCOUNT_ACTION_SECRET:development-only-account-action-secret}
    public-base-url: ${JOB_AGENT_PUBLIC_BASE_URL:http://localhost:8000}
    ttl-minutes: ${JOB_AGENT_VERIFICATION_TOKEN_TTL_MINUTES:1440}
    reset-ttl-minutes: ${JOB_AGENT_PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    cooldown-seconds: ${JOB_AGENT_ACCOUNT_EMAIL_COOLDOWN_SECONDS:60}
    account-hourly-limit: ${JOB_AGENT_ACCOUNT_EMAIL_HOURLY_LIMIT:5}
    source-hourly-limit: ${JOB_AGENT_ACCOUNT_EMAIL_SOURCE_HOURLY_LIMIT:20}
    max-attempts: ${JOB_AGENT_ACCOUNT_EMAIL_MAX_ATTEMPTS:5}
    claim-timeout-seconds: ${JOB_AGENT_ACCOUNT_EMAIL_CLAIM_TIMEOUT_SECONDS:300}
    retry-base-seconds: ${JOB_AGENT_ACCOUNT_EMAIL_RETRY_BASE_SECONDS:30}
    retention-days: ${JOB_AGENT_ACCOUNT_EMAIL_RETENTION_DAYS:14}
  billing:
    enabled: ${PLATFORM_BILLING_ENABLED:false}
    webhook-enabled: ${PLATFORM_PAYMENT_WEBHOOK_ENABLED:false}
    webhook-secret: ${PLATFORM_PAYMENT_WEBHOOK_SECRET:}
    webhook-max-skew-seconds: ${PLATFORM_PAYMENT_WEBHOOK_MAX_SKEW_SECONDS:300}
    price-per-million-tokens-yuan: ${PLATFORM_PRICE_PER_MILLION_TOKENS_YUAN:${JOB_AGENT_BILLING_PRICE_PER_MILLION_TOKENS_YUAN:25.0}}
    low-balance-threshold-micro-yuan: ${PLATFORM_LOW_BALANCE_THRESHOLD_MICRO_YUAN:10000000}
    low-balance-threshold-yuan: ${JOB_AGENT_BILLING_LOW_BALANCE_THRESHOLD_YUAN:}
    starting-balance-yuan: ${JOB_AGENT_BILLING_STARTING_BALANCE_YUAN:0}
    demo-recharge-enabled: ${JOB_AGENT_DEMO_RECHARGE_ENABLED:}
    demo-recharge-max-amount-yuan: ${JOB_AGENT_DEMO_RECHARGE_MAX_AMOUNT_YUAN:20}
    demo-recharge-max-total-yuan: ${JOB_AGENT_DEMO_RECHARGE_MAX_TOTAL_YUAN:50}
    environment: ${JOB_AGENT_ENVIRONMENT:development}

management:
  tracing:
    enabled: ${PLATFORM_TRACING_ENABLED:false}
    sampling:
      probability: ${PLATFORM_TRACE_SAMPLE_RATIO:0.1}
  otlp:
    tracing:
      endpoint: ${PLATFORM_OTLP_TRACING_ENDPOINT:http://alloy:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        platform.web.duration: true
  health:
    redis:
      enabled: ${PLATFORM_WEB_SECURITY_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-} spanId=%X{spanId:-} requestId=%X{request_id:-}]"
