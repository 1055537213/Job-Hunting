spring:
  application:
    name: job-hunting-platform
  autoconfigure:
    # 平台服务骨架默认不连接数据库；启用 PLATFORM_BILLING_ENABLED 后，
    # BillingConfiguration 会创建 PostgreSQL DataSource。
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    protocol: ${SERVER_TOMCAT_PROTOCOL:org.apache.coyote.http11.Http11NioProtocol}

app:
  version: ${APP_VERSION:0.1.0}

platform:
  internal-token: ${PLATFORM_INTERNAL_TOKEN:}
  auth:
    enabled: ${PLATFORM_AUTH_ENABLED:false}
  email:
    action-secret: ${JOB_AGENT_ACCOUNT_ACTION_SECRET:development-only-account-action-secret}
    public-base-url: ${JOB_AGENT_PUBLIC_BASE_URL:http://localhost:8000}
    ttl-minutes: ${JOB_AGENT_VERIFICATION_TOKEN_TTL_MINUTES:1440}
    cooldown-seconds: ${JOB_AGENT_ACCOUNT_EMAIL_COOLDOWN_SECONDS:60}
    account-hourly-limit: ${JOB_AGENT_ACCOUNT_EMAIL_HOURLY_LIMIT:5}
    source-hourly-limit: ${JOB_AGENT_ACCOUNT_EMAIL_SOURCE_HOURLY_LIMIT:20}
    max-attempts: ${JOB_AGENT_ACCOUNT_EMAIL_MAX_ATTEMPTS:5}
    claim-timeout-seconds: ${JOB_AGENT_ACCOUNT_EMAIL_CLAIM_TIMEOUT_SECONDS:300}
    retry-base-seconds: ${JOB_AGENT_ACCOUNT_EMAIL_RETRY_BASE_SECONDS:30}
    retention-days: ${JOB_AGENT_ACCOUNT_EMAIL_RETENTION_DAYS:14}
  billing:
    enabled: ${PLATFORM_BILLING_ENABLED:false}
    price-per-million-tokens-yuan: ${PLATFORM_PRICE_PER_MILLION_TOKENS_YUAN:25.0}
    low-balance-threshold-micro-yuan: ${PLATFORM_LOW_BALANCE_THRESHOLD_MICRO_YUAN:10000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false
