# Shared-host production overlay. Use after compose.prod.yaml when another
# application already owns the server's public edge ports:
# docker compose -f compose.yaml -f compose.prod.yaml -f compose.coexist.yaml up -d --no-build

services:
  web:
    environment:
      # The lightweight topology keeps Prometheus metrics but does not start the
      # Loki/Tempo/Alloy trace and log pipeline.
      JOB_AGENT_OTEL_ENABLED: "false"
    ports: !override
      - "127.0.0.1:18081:8000"

  worker:
    environment:
      JOB_AGENT_OTEL_ENABLED: "false"

  beat:
    environment:
      JOB_AGENT_OTEL_ENABLED: "false"

  coexist-https:
    image: "${JOB_AGENT_COEXIST_NGINX_IMAGE:-nginx:1.30.4-alpine3.24@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46}"
    restart: unless-stopped
    environment:
      JOB_AGENT_PUBLIC_IP: "${JOB_AGENT_PUBLIC_IP:?set JOB_AGENT_PUBLIC_IP in .env}"
      NGINX_ENVSUBST_FILTER: "JOB_AGENT_PUBLIC_IP"
    ports:
      - "0.0.0.0:8443:8443"
    volumes:
      - ./deploy/nginx/coexist-ip-https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - type: bind
        source: "${JOB_AGENT_LETSENCRYPT_DIR:-/etc/letsencrypt}"
        target: /etc/letsencrypt
        read_only: true
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-check-certificate --quiet --output-document=- https://127.0.0.1:8443/api/health >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  prometheus:
    ports: !override
      - "127.0.0.1:${JOB_AGENT_COEXIST_PROMETHEUS_PORT:-19090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${JOB_AGENT_COEXIST_PROMETHEUS_RETENTION:-7d}"

  alertmanager:
    ports: !override
      - "127.0.0.1:${JOB_AGENT_COEXIST_ALERTMANAGER_PORT:-19093}:9093"

  # These services remain available through explicit profiles, but are not
  # started by the coexist deployment. The dedicated coexist HTTPS edge owns
  # only port 8443, so the existing application's public edge remains intact.
  reverse-proxy:
    profiles: ["standalone-edge"]

  loki:
    profiles: ["full-observability"]

  tempo:
    profiles: ["full-observability"]

  alloy:
    profiles: ["full-observability"]

  grafana:
    profiles: ["full-observability"]
