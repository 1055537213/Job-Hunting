# Java 平台服务的本地开发覆盖文件。
# 使用 `docker compose -f compose.yaml -f compose.platform.yaml up -d platform-service`
# 启动时，现有 Python Web、Worker 和数据库拓扑保持不变。
services:
  platform-service:
    build:
      context: ./platform-service
      dockerfile: Dockerfile
    image: job-hunting-agent:platform-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JOB_AGENT_PLATFORM_PORT:-8081}:8081"
    environment:
      SERVER_PORT: "8081"
      APP_VERSION: "0.1.0"
      PLATFORM_BILLING_ENABLED: "${JOB_AGENT_JAVA_BILLING_ENABLED:-false}"
      JOB_AGENT_BILLING_PRICE_PER_MILLION_TOKENS_YUAN: "${JOB_AGENT_BILLING_PRICE_PER_MILLION_TOKENS_YUAN:-25}"
      JOB_AGENT_BILLING_STARTING_BALANCE_YUAN: "${JOB_AGENT_BILLING_STARTING_BALANCE_YUAN:-0}"
      JOB_AGENT_BILLING_LOW_BALANCE_THRESHOLD_YUAN: "${JOB_AGENT_BILLING_LOW_BALANCE_THRESHOLD_YUAN:-10}"
      JOB_AGENT_DEMO_RECHARGE_ENABLED: "${JOB_AGENT_DEMO_RECHARGE_ENABLED:-true}"
      JOB_AGENT_DEMO_RECHARGE_MAX_AMOUNT_YUAN: "${JOB_AGENT_DEMO_RECHARGE_MAX_AMOUNT_YUAN:-20}"
      JOB_AGENT_DEMO_RECHARGE_MAX_TOTAL_YUAN: "${JOB_AGENT_DEMO_RECHARGE_MAX_TOTAL_YUAN:-50}"
      PLATFORM_AUTH_ENABLED: "${JOB_AGENT_JAVA_AUTH_ENABLED:-true}"
      PLATFORM_WEB_SECURITY_ENABLED: "true"
      PLATFORM_REDIS_HOST: redis
      PLATFORM_REDIS_PASSWORD: "${JOB_AGENT_REDIS_PASSWORD:?set JOB_AGENT_REDIS_PASSWORD}"
      PLATFORM_REDIS_DATABASE: "1"
      PLATFORM_RATE_LIMIT_KEY_PREFIX: "${PLATFORM_RATE_LIMIT_KEY_PREFIX:-job_agent:platform_rate_limit}"
      PLATFORM_TRUSTED_PROXY_CIDRS: "${PLATFORM_TRUSTED_PROXY_CIDRS:-}"
      PLATFORM_METRICS_ENABLED: "true"
      PLATFORM_METRICS_TOKEN_FILE: /run/secrets/platform_metrics_token
      JOB_AGENT_RATE_LIMIT_WINDOW_SECONDS: "${JOB_AGENT_RATE_LIMIT_WINDOW_SECONDS:-60}"
      JOB_AGENT_RATE_LIMIT_AUTH_REQUESTS: "${JOB_AGENT_RATE_LIMIT_AUTH_REQUESTS:-20}"
      JOB_AGENT_RATE_LIMIT_ADMIN_REQUESTS: "${JOB_AGENT_RATE_LIMIT_ADMIN_REQUESTS:-120}"
      JOB_AGENT_RATE_LIMIT_WRITE_REQUESTS: "${JOB_AGENT_RATE_LIMIT_WRITE_REQUESTS:-120}"
      JOB_AGENT_RATE_LIMIT_DEFAULT_REQUESTS: "${JOB_AGENT_RATE_LIMIT_DEFAULT_REQUESTS:-240}"
      PLATFORM_INTERNAL_TOKEN: "${JOB_AGENT_PLATFORM_INTERNAL_TOKEN:?set JOB_AGENT_PLATFORM_INTERNAL_TOKEN}"
      PLATFORM_TASKS_PYTHON_BASE_URL: "http://web:8000"
      JOB_AGENT_ACCOUNT_ACTION_SECRET: "${JOB_AGENT_ACCOUNT_ACTION_SECRET:-development-only-account-action-secret}"
      JOB_AGENT_PUBLIC_BASE_URL: "${JOB_AGENT_BROWSER_BASE_URL:-http://localhost:8000}"
      JOB_AGENT_REGISTRATION_ENABLED: "${JOB_AGENT_REGISTRATION_ENABLED:-true}"
      JOB_AGENT_CONSENT_REQUIRED: "${JOB_AGENT_CONSENT_REQUIRED:-false}"
      JOB_AGENT_TERMS_VERSION: "${JOB_AGENT_TERMS_VERSION:-development}"
      JOB_AGENT_PRIVACY_VERSION: "${JOB_AGENT_PRIVACY_VERSION:-development}"
      JOB_AGENT_EMAIL_VERIFICATION_REQUIRED: "${JOB_AGENT_EMAIL_VERIFICATION_REQUIRED:-false}"
      JOB_AGENT_COOKIE_SECURE: "${JOB_AGENT_COOKIE_SECURE:-false}"
      JOB_AGENT_CSRF_ENABLED: "${JOB_AGENT_CSRF_ENABLED:-true}"
      JOB_AGENT_VERIFICATION_TOKEN_TTL_MINUTES: "${JOB_AGENT_VERIFICATION_TOKEN_TTL_MINUTES:-1440}"
      JOB_AGENT_PASSWORD_RESET_TOKEN_TTL_MINUTES: "${JOB_AGENT_PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}"
      JOB_AGENT_ACCOUNT_EMAIL_COOLDOWN_SECONDS: "${JOB_AGENT_ACCOUNT_EMAIL_COOLDOWN_SECONDS:-60}"
      JOB_AGENT_ACCOUNT_EMAIL_HOURLY_LIMIT: "${JOB_AGENT_ACCOUNT_EMAIL_HOURLY_LIMIT:-5}"
      JOB_AGENT_ACCOUNT_EMAIL_SOURCE_HOURLY_LIMIT: "${JOB_AGENT_ACCOUNT_EMAIL_SOURCE_HOURLY_LIMIT:-20}"
      JOB_AGENT_ACCOUNT_EMAIL_MAX_ATTEMPTS: "${JOB_AGENT_ACCOUNT_EMAIL_MAX_ATTEMPTS:-5}"
      JOB_AGENT_ACCOUNT_EMAIL_RETRY_BASE_SECONDS: "${JOB_AGENT_ACCOUNT_EMAIL_RETRY_BASE_SECONDS:-30}"
      JOB_AGENT_ACCOUNT_EMAIL_CLAIM_TIMEOUT_SECONDS: "${JOB_AGENT_ACCOUNT_EMAIL_CLAIM_TIMEOUT_SECONDS:-300}"
      JOB_AGENT_ACCOUNT_EMAIL_RETENTION_DAYS: "${JOB_AGENT_ACCOUNT_EMAIL_RETENTION_DAYS:-14}"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${JOB_AGENT_POSTGRES_DB:-job_agent}"
      SPRING_DATASOURCE_USERNAME: "${JOB_AGENT_POSTGRES_USER:-job_agent}"
      SPRING_DATASOURCE_PASSWORD: "${JOB_AGENT_POSTGRES_PASSWORD:-}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    secrets:
      - platform_metrics_token
  prometheus:
    volumes:
      - ./deploy/prometheus/prometheus.hybrid.yml:/etc/prometheus/prometheus.yml:ro
    secrets:
      - platform_metrics_token
    depends_on:
      platform-service:
        condition: service_healthy
  auth-gateway:
    profiles: ["hybrid-local"]
    image: caddy:2.9.1-alpine
    ports:
      - "127.0.0.1:${JOB_AGENT_BROWSER_GATEWAY_PORT:-18082}:8080"
    volumes:
      - ./deploy/Caddyfile.hybrid.local:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      platform-service:
        condition: service_healthy
  web:
    environment:
      JOB_AGENT_JAVA_BILLING_BASE_URL: "http://platform-service:8081"
      JOB_AGENT_JAVA_BILLING_ENABLED: "${JOB_AGENT_JAVA_BILLING_ENABLED:-false}"
      JOB_AGENT_JAVA_BILLING_INTERNAL_TOKEN: "${JOB_AGENT_PLATFORM_INTERNAL_TOKEN:?set JOB_AGENT_PLATFORM_INTERNAL_TOKEN}"
      JOB_AGENT_JAVA_AUTH_ENABLED: "${JOB_AGENT_JAVA_AUTH_ENABLED:-true}"
      JOB_AGENT_JAVA_AUTH_BASE_URL: "http://platform-service:8081"
      JOB_AGENT_JAVA_AUTH_INTERNAL_TOKEN: "${JOB_AGENT_PLATFORM_INTERNAL_TOKEN:?set JOB_AGENT_PLATFORM_INTERNAL_TOKEN}"
    depends_on:
      platform-service:
        condition: service_healthy
  worker:
    environment:
      JOB_AGENT_JAVA_BILLING_BASE_URL: "http://platform-service:8081"
      JOB_AGENT_JAVA_BILLING_ENABLED: "${JOB_AGENT_JAVA_BILLING_ENABLED:-false}"
      JOB_AGENT_JAVA_BILLING_INTERNAL_TOKEN: "${JOB_AGENT_PLATFORM_INTERNAL_TOKEN:?set JOB_AGENT_PLATFORM_INTERNAL_TOKEN}"
      JOB_AGENT_JAVA_AUTH_ENABLED: "${JOB_AGENT_JAVA_AUTH_ENABLED:-true}"
      JOB_AGENT_JAVA_AUTH_BASE_URL: "http://platform-service:8081"
      JOB_AGENT_JAVA_AUTH_INTERNAL_TOKEN: "${JOB_AGENT_PLATFORM_INTERNAL_TOKEN:?set JOB_AGENT_PLATFORM_INTERNAL_TOKEN}"
    depends_on:
      platform-service:
        condition: service_healthy
  beat:
    environment:
      JOB_AGENT_JAVA_AUTH_ENABLED: "${JOB_AGENT_JAVA_AUTH_ENABLED:-true}"
      JOB_AGENT_JAVA_AUTH_BASE_URL: "http://platform-service:8081"
      JOB_AGENT_JAVA_AUTH_INTERNAL_TOKEN: "${JOB_AGENT_PLATFORM_INTERNAL_TOKEN:?set JOB_AGENT_PLATFORM_INTERNAL_TOKEN}"
    depends_on:
      platform-service:
        condition: service_healthy

secrets:
  platform_metrics_token:
    environment: JOB_AGENT_PLATFORM_METRICS_TOKEN
