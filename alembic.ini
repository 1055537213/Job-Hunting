# Keep this INI ASCII because Alembic reads it with the Windows locale codec.
# The runtime database URL is injected by database_migrations.py.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
# Runtime reads JOB_AGENT_DATABASE_URL in alembic/env.py. Test helpers inject a private option.
sqlalchemy.url =
