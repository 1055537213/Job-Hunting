[project]
# Python 包的基础元数据。项目作为应用部署，不发布到 PyPI。
name = "job-hunting-agent"
version = "0.1.0"
description = "A multi-tenant job hunting assistant with RAG, background tasks, and usage billing."
# 本项目的本地 Conda 环境和 Docker 镜像均以 Python 3.12.13 验证，避免补丁版本漂移。
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.0",
    "boto3>=1.35.0",
    "celery[redis]>=5.4.0",
    "fastapi>=0.124.4",
    "langchain>=1.2.12",
    "langchain-core>=1.2.18",
    "langchain-openai>=1.1.11",
    "langchain-text-splitters>=1.1.1",
    "argon2-cffi>=23.1.0",
    "onnxruntime>=1.18.0",
    "pdfplumber>=0.11.0",
    "Pillow>=10.0.0",
    "pypdfium2>=4.30.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.9",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.0",
    "rapidocr>=3.0.0",
    "reportlab>=4.0.0",
    "SQLAlchemy>=2.0.0",
    "uvicorn>=0.38.0",
]

[project.scripts]
# 安装成包以后，容器和本地开发都通过这个入口启动网页服务。
job-agent-web = "job_hunting_agent.web:main"
# Worker 使用独立进程消费 Redis/Celery 任务，不阻塞 FastAPI 请求。
job-agent-worker = "job_hunting_agent.worker:main"
# Beat 使用独立进程按上海自然日投递维护任务。
job-agent-beat = "job_hunting_agent.beat:main"

[tool.setuptools.package-data]
# Web 前端静态资源需要随 Python 包一起安装。
job_hunting_agent = ["web_static/*", "web_static/vendor/*"]

[tool.pytest.ini_options]
# 让 pytest 在不安装包的情况下，也能从 src/ 找到项目代码。
pythonpath = ["src"]
# 只收集正式测试目录，避免扫描 data/ 中已忽略的运行文件和历史临时目录。
testpaths = ["tests"]
# 项目不依赖 pytest 增量缓存；关闭缓存也避免异常 ACL 的旧目录影响测试。
addopts = "-p no:cacheprovider"

[tool.ruff.lint.per-file-ignores]
# 测试夹具用静态多行配置更易阅读；将它们改成 f-string 不会带来任何可读性或安全收益。
"tests/**" = ["FLY002"]
